# Tous les seuils géométriques sont des multiples de h, la hauteur typique d'un caractère
# (estimée automatiquement sur la feuille, sauf si `echelle.hauteur_caractere` > 0).
# Les seuils de temps sont en secondes.

[echelle]
hauteur_caractere = 0.0     # 0 = estimation automatique (unités feuille)
centile = 60                # centile des hauteurs de traits « normaux » retenu comme h

[groupement]
# --- Morceaux d'un même caractère / caractères collés ---
proche_dx = 0.35            # écart horizontal max entre boîtes pour fusionner
proche_dy = 0.35            # écart vertical max
inclusion = 0.6             # part d'un trait contenue dans un autre (racine, grandes parenthèses)

# --- Fractions ---
barre_ratio_min = 3.0       # largeur / hauteur minimales d'une barre
barre_longueur_min = 0.6    # longueur minimale d'une barre
barre_epaisseur_max = 0.5   # épaisseur maximale d'une barre
fraction_distance_max = 1.4 # écart vertical max barre ↔ numérateur / dénominateur (1,0 laissait le x de d/dx hors de la fraction : feuille_3)
fraction_marge_x = 0.4      # débord horizontal toléré au-delà de la barre
fraction_largeur_max = 1.3  # un numérateur/dénominateur est au plus aussi large que 1,3 × la barre
fraction_demi_bande = 0.6   # demi-hauteur de la bande « ligne principale » d'une fraction

# --- Grands symboles (∑ ∏ ∫ …) et leurs bornes ---
grand_symbole_hauteur = 1.5 # hauteur minimale d'un grand symbole
grand_symbole_dx = 1.8      # zone d'absorption à droite
grand_symbole_dy = 1.3      # zone d'absorption au-dessus / au-dessous
petit_trait_hauteur = 0.8   # hauteur maximale d'un trait absorbé comme borne
absorption_marge_x = 0.5    # débord horizontal pour les bornes au-dessus / au-dessous
borne_dist_sans_temps = 1.5 # une borne à moins de 1,5 h du symbole est liée même écrite longtemps après

# --- Regroupement en lignes ---
ligne_recouvrement = 0.5    # recouvrement vertical minimal (fraction de la plus petite bande)
ligne_tolerance = 0.15      # tolérance pour un petit trait (« - », « . ») dans la bande d'un autre
ligne_ecart_h = 3.0         # écart horizontal max entre deux éléments d'une même ligne
ligne_ecart_grand_h = 4.2   # idem quand l'un des deux contient un grand symbole (lim, ∑, ∫…)
exposant_ecart_h = 1.2      # écart horizontal max pour un exposant / indice
exposant_marge_v = 0.5      # marge verticale pour détecter un exposant / indice
exposant_decalage = 1.4     # décalage max des centres de bandes pour un exposant / indice (1,0 coupait les exposants écrits haut : feuille_3)
temps_proche_s = 8.0        # délai max entre deux éléments pour les liens « faibles »
passes = 5                  # passes de fusion maximales

# --- Filtrage ---
separateur_largeur = 8.0    # un trait isolé plus large que ça (× h) et très plat = règle de séparation, ignorée
separateur_ratio = 12.0     # largeur / hauteur minimales d'une règle de séparation
bruit_taille = 0.15        # groupe plus petit que ça (× h dans les deux dimensions) = bruit
hauteur_suspecte = 6.0      # groupe plus haut que ça (× h) : signalé dans le rapport

[rendu]
hauteurs = [128, 256]       # hauteurs d'image testées (px) ; la meilleure est retenue si vérité fournie
marge = 0.5                 # marge autour du groupe (× h, en pixels de rendu)
epaisseur = 0.09            # épaisseur du trait (× h en pixels de rendu), minimum 2 px
surechantillonnage = 4      # dessin à 4× puis réduction (anticrénelage)
largeur_max_ratio = 14.0    # largeur/hauteur au-delà de laquelle le rapport signale un risque

[reco]
modeles = ["pix2text", "texteller"]
pix2text_modele = "mfr-1.5"  # "mfr" (v1.0) ou "mfr-1.5" : seuls modèles gratuits (ONNX)
texteller_backend = "pytorch" # "pytorch" (1,2 Go) ou "onnx" (≈ 1,3 Go de plus à télécharger)
threads = 0                  # threads PyTorch ; 0 = valeur par défaut
# Plafond de tokens adaptatif (TexTeller) : plafond = base + par_h × (largeur du groupe / h), borné. Calé sur feuille_1 et feuille_2 :
# une ligne saine produit au plus ~2,5 tokens par unité de h (max. mesuré 3,2 pour une matrice étroite) ; le plafond garde ≥ 1,5× de marge.
plafond_actif = true
tokens_base = 20
tokens_par_h = 2.5
tokens_min = 24
tokens_max = 400
boucle_repetitions = 3       # arrêt si un même motif de tokens se répète plus de 3 fois de suite (8 pour un token seul)

[correction]
backend = "claude-cli"       # "claude-cli" (abonnement Claude Code, `claude -p`) ou "api" (SDK anthropic + ANTHROPIC_API_KEY)
modele = "claude-sonnet-5-5"
commande = "claude"          # exécutable du CLI (backend claude-cli)
delai_s = 240                # délai max d'un appel
effort = ""                  # niveau d'effort de `claude -p --effort` (low, medium, high, xhigh, max) ; "" = défaut de Claude Code
mode = "tout"                # "tout" | "sans_solution" | "indice" | "resultat_final" (l'app peut le surcharger)
ton = "bref"                 # "bref" | "detaille"
ignorer_couleurs = []        # traits de ces couleurs (#rrggbb) retirés avant lecture et correction ; ex. ["#1a56db"]
dossier_logs = "logs"        # une sous-dossier par appel : requête, prompt, réponse brute, durées (local, hors dépôt)
entree = "image"             # ce que reçoit Claude : "image" (page découpée en bandes, groupes encadrés et numérotés ; TexTeller inutile), "ocr" (LaTeX lu par TexTeller) ou "ocr_image"
bande_hauteur_h = 24         # hauteur visée d'une bande (× h) : feuille_3 → 3 bandes, feuille_2 → 3 bandes ; 1 seule image si la feuille est courte
bandes_max = 8
verification = false         # 2e passe (vérifier chaque « erreur » sur l'image du groupe) : redondante en mode image (47/47 confirmées sur feuille_3), ~17 s et ×2 le coût ; utile en mode "ocr"
verification_parallele = 3   # appels simultanés pour la 2e passe
verification_largeur_max = 1500  # px : largeur max de l'image envoyée (la hauteur s'adapte, 128 à 384 px)
